review:
  status: "agent-reviewed"

fidelity:
  divergences: >-
    The covering transfer uses Mathlib's all-simplex singular chain and homology
    functors, not normalized chains or May's tensor-coefficient construction.
    It makes no CGWH, negative-degree, reduced, relative or deck-equivariant
    transfer comparison. Generic small-chain and two-open homology results retain arbitrary TopCat
    universes, lifted integral coefficients and exact cover hypotheses. Reduced
    homology uses nonnegative degrees; no augmented degree-minus-one statement
    follows. Contractible-space premises include nonemptiness; empty-space and
    degenerate-cover clients use their separately valid hypotheses. Acyclic-open
    isomorphisms retain both adjacent-degree vanishings, and the cover-swapping
    minus-identity criterion retains its monomorphism and transported-map premises.
    Explicit geometric calculations concern the metric unit circle and standard metric S2 and
    their fixed integral coordinates, not every homology group of every sphere,
    arbitrary coefficients, characteristic-two obstructions or smooth tangent
    bundles. The tangent-field homotopy is more general than the finite-dimensional
    hairy-ball endpoint. No Clifford algebra theory, arbitrary-sphere hairy-ball
    theorem, algebraic nonfree-kernel/row result or complete source formalization
    is claimed. Explicitly noncomputable subdivideSimplex, homotopySimplex,
    singularSubdivisionIterate and singularHomotopyIterate expose mathematical
    definitions and equations, not executable extraction; no external executable
    client equivalence is promised. The lemma exists_mem_support_of_mem_support_sum
    has no DecidableEq alpha binder; explicit positional or named-class callers
    must match its current signature.

acknowledgements: >-
  The mathlib community supplies the underlying formal mathematics; its authorship
  and license notices remain with the dependency. Simplicial Objects supplies
  the simplicial finite-fiber transfer and canonical integral coordinates,
  originally used in Sphere and formalized by Formal Frontier Agents, including
  Prism, using Mathlib's simplicial coproduct and lifted module APIs.
  Fundamental Groupoids is the canonical
  home of the generic covering interfaces originally developed in Sphere,
  building on Mathlib's lifting and monodromy by Junyan Xu and deck groups by
  Kim Morrison. May supplies the covering-transfer
  exercise and its coefficient conventions. Lean and Lake supply the proof
  assistant and build system. Weibel's bibliographic authorship is distinct from
  project formalization authorship. Original project contributions and identified
  project adaptations use the Apache-2.0 license; no ownership
  of, or permission to relicense, third-party expression is asserted. The
  formalization.yaml standard supplies the field vocabulary; this filled-in
  metadata prose is a project contribution, not upstream schema implementation.
