version: "v0.4"

project:
  name: "Sphere topology"
  description: >-
    Reusable Lean topology and integral singular homology: normalization of
    nowhere-zero continuous fields, identity-to-antipodal homotopies from
    orthogonal fields, signed subdivision and cover-small chains, ordinary
    two-open Mayer-Vietoris, nonnegative reduced homology and its low-degree
    Mayer-Vietoris boundary. Explicit circle and two-sphere calculations give
    the antipodal action on H2 of the literal standard two-sphere and its
    continuous orthogonal-field hairy-ball theorem.
  authors:
    - "Formal Frontier Agents"
    - "Prism (AI agent; setup, source research coordination, integration, native interfaces, documentation, tests and metadata)"
    - "formalization-worker-a (AI agent; six historical production Tasks, later release repairs and predecessor work identified below)"
    - "formalization-worker-b (AI agent; four production Tasks and predecessor work identified below)"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: "Complete-book build dated 2013-08-29, Example I.1.2.2."
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The sphere tangent-field obstruction motivates this independent topology
      library. The source passage rules out two independent tangent fields;
      the library proves the stronger one-field zero theorem on literal S2.
      Algebraic kernel nonfreeness, unimodular-row noncompletion and the exact
      source adapter are separate statements, not consequences certified by
      this metadata. No full example, chapter or book coverage is claimed.
      Bibliographic authorship is distinct from Lean expression provenance.
      The canonical private-project asset is library
      s-a1e29c47d014454b97d2ecbaef6b4282/v001, 4,958,181 bytes, SHA-256
      a04f53c9393b20672fab2a6818279b2f9996dbc7cf74735789ed13804b058845.
      The author-hosted source was supplied for the private project library;
      no explicit license or broader redistribution grant was established.
      Pagination differs from the AMS print edition. The selection-time errata
      URL returned HTTP 404; no errata original is included or claimed. No book
      PDF, scan or quoted passage is shipped in this repository.
  - title: "Hairy-ball theorem on the two-sphere: project proof exposition"
    authors:
      - "Formal Frontier Agents"
    id: "FormalFrontier/source-weibel-k-book@21da829968a3fa4055df276db98f7611a4af36a6:expositions/hairy-ball-sphere2.md"
    type: "project-proof-exposition"
    relationship: "adapts"
    author_endorsement: "n/a"
    note: >-
      Internal mathematical predecessor, not a claim to have invented the
      classical theorem. It gives the normalization/cosine-sine homotopy and
      integral homology obstruction, followed here through explicit small-chain,
      Mayer-Vietoris, circle and two-sphere constructions. Original exposition
      Task hive-request-9ed2ddb74e1b0fe15858420f010c884adbe3b1fc,
      UID 39d11a4d-3d99-48ba-b877-2eaa0536e10d; repair Task
      hive-request-ad8216181333e7ae601b6f1a6a87594c1ef3a71f,
      UID 164a3e69-0683-4343-9334-dac00cea61f4. Source issue13/29784
      records acceptance, retained in merge3a79ebc871dd81ac0b9526542a1244f3beafa518.
      A reviewed Markdown proof is not itself a Lean or source-coverage verdict.

