version: "v0.4"

project:
  name: "Sphere topology"
  description: >-
    Reusable Lean topology and singular homology: arbitrary-index circle bouquets,
    inclusions, positive-generator homomorphisms, retractions and generator
    nonidentity, without a free-group identification; normalization of nowhere-zero
    continuous fields, identity-to-antipodal homotopies from orthogonal fields,
    integral subdivision, cover-small chains and two-open Mayer-Vietoris,
    nonnegative reduced integral homology and degree-zero criteria for path
    connectedness. Finite-fiber coverings give transfers on all-simplex singular
    chains and ordinary homology with categorical coefficient objects.
    Generic based lifting, monodromy, maps of covers and deck-group comparisons
    are supplied by Fundamental Groupoids, their canonical home, and re-exported
    through deprecated Sphere covering module paths.
    Explicit circle and two-sphere calculations give
    the antipodal action on H2 of the standard two-sphere and its
    continuous orthogonal-field hairy-ball theorem.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier Agents"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: "Complete-book build dated 2013-08-29, Example I.1.2.2."
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The sphere tangent-field obstruction motivates this independent topology
      library. The source passage rules out two independent tangent fields;
      the library proves the stronger one-field zero theorem on the standard metric S2.
      Algebraic kernel nonfreeness, unimodular-row noncompletion and the exact
      source adapter are separate statements, not consequences certified by
      this metadata. No full example, chapter or book coverage is claimed.
      Bibliographic authorship is distinct from Lean expression provenance.
      No book PDF, scan, figure or quoted passage is shipped here. No
      redistribution grant for the book or endorsement by its author is
      asserted. Mathematical and formalization contributions are separately
      credited in docs/CREDITS.md.

  - title: "A Concise Course in Algebraic Topology"
    authors:
      - "J. Peter May"
    id: "https://www.math.uchicago.edu/~may/CONCISE/ConciseRevised.pdf"
    type: "book"
    location: "Revised edition, Chapter 2, §8; Chapter 16, Problem 3."
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Motivates the circle-bouquet setting, covering transfer and its sheet
      formula. The bouquet fundamental-group calculation is not established here. The coefficient
      objects and all-simplex chain complex differ from the normalized
      tensor-coefficient convention of the book. No book expression or asset
      is redistributed.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: "builds-on"
    note: >-
      Reuses continuous maps and homotopies,
      real inner-product spaces, standard simplices, simplicial sets, integral
      singular chains, chain complexes, homology, short exact sequences,
      category-theoretic kernels, stereographic projection and contractibility.
      Dependency implementation is not vendored; upstream authorship and notices
      remain upstream. The generated Lake manifest records the resolved graph,
      not original dependency implementation. Project expression origins and
      prior formalization contributions are credited in docs/CREDITS.md; these
      are not additional library dependencies.
  - id: "https://github.com/FormalFrontier/simplicial-objects/tree/143f667bdeb0aeccd02e6475781d5c456f00c95b"
    relationship: "builds-on"
    note: >-
      Supplies finite-fiber coproduct transfers for equifibered simplicial maps,
      the all-simplex chain transfer, and its induced homology transfer.
      The covering construction specializes these maps using evaluation of
      singular lifts. Also supplies the four canonical AlgebraicTopology
      integral-coordinate declarations from SimplicialObjects.ChainCoordinates,
      publicly re-exported by Sphere SmallChains. Lifted integer coefficients
      and degreewise all-simplex module coordinates retain their universes and
      providers; no chain, natural or normalized-chain isomorphism is asserted.
      Dependency authorship and notices remain upstream.

  - id: "https://github.com/FormalFrontier/fundamental-groupoids/tree/edbef2ae0d8a0871b0bbfbc47214e8d6542a2b8e"
    relationship: "builds-on"
    note: >-
      Canonical home of the generic based covering-lift criterion, based
      equivalences, monodromy and equivariant fiber maps, deck actions and
      monodromy-centralizer comparisons originally developed in Sphere.
      Declaration names and mathematical namespaces are unchanged. The five
      old covering module paths are public-import shims, deprecated since
      2026-10-17 and supported for at least three months from that date.
      Joint use requires a Sphere version providing these shims together with
      the Fundamental Groupoids revision recorded here and the resolved graph
      in lake-manifest.json, including inherited Group Theory at
      12ea07a60c5e6c219d8996eb56d7485139041e15. The covering modules cannot be
      co-imported with legacy Sphere releases defining duplicate copies;
      arbitrary version pairs are not promised compatible.
      Dependency authorship and source and Mathlib credits remain intact.

status:
  scope: >-
    Arbitrary-index circle bouquets with inclusions, descent, positive-generator
    homomorphisms, circle retractions and generator nonidentity; bijectivity of
    the generator map and its free-group identification are not established here.
    Continuous-field topology, integral subdivision and cover-small chains,
    ordinary two-open Mayer-Vietoris, nonnegative reduced integral homology,
    explicit circle and two-sphere calculations, and the unit two-sphere
    continuous orthogonal-field zero theorem. The reduced degree-zero Mayer-Vietoris
    sequence is exact at the biproduct for every two-open cover; its final map
    is epic when the intersection is nonempty. Total degree-zero augmentation
    is invertible exactly when the space is path connected, for a nonzero
    coefficient object in a preadditive category with the requisite small
    coproducts and homology; nonemptiness of the space is not assumed. For
    nonempty spaces, integral reduced H0 vanishes exactly for path connectedness.
    The covering transfer takes a coefficient object in a preadditive category
    with coproducts indexed in the space universe; ordinary homology adds only
    CategoryWithHomology. Its lift-sum and fixed-sheet formulas concern transfer
    followed by pushforward; finite point fibers and their uniform cardinality
    are separate hypotheses. Nonempty, surjective and connected coverings are
    not required. Generic covering foundations are supplied by Fundamental
    Groupoids rather than implemented twice; the based equal-image comparison
    is not a general covering-space classification. No complete coverage of
    Weibel or any other source is claimed. See README.md
    for exact interfaces and docs/CREDITS.md for attribution.
  main_results:
    - declaration: "IsCoveringMap.singularChainComplexTransfer"
      file: "SphereTopology/Homology/Singular/Transfer.lean"
      note: "All-simplex singular chain transfer for a covering map with finite point fibers, with a coefficient object in a preadditive category with the requisite coproducts."
    - declaration: "IsCoveringMap.summandι_singularChainComplexTransfer_f"
      file: "SphereTopology/Homology/Singular/Transfer.lean"
      note: "The characteristic formula specifies a singular simplex's image as the sum of all its lifts."
    - declaration: "IsCoveringMap.singularChainComplexTransfer_comp_map"
      file: "SphereTopology/Homology/Singular/Transfer.lean"
      note: "The sheet formula specifies transfer followed by pushforward as d times identity when finite point fibers all have cardinality d."
    - declaration: "IsCoveringMap.singularHomologyTransfer"
      file: "SphereTopology/Homology/Singular/Transfer.lean"
      note: "The induced ordinary singular homology transfer in every nonnegative degree, requiring CategoryWithHomology."
    - declaration: "IsCoveringMap.singularHomologyTransfer_comp_map"
      file: "SphereTopology/Homology/Singular/Transfer.lean"
      note: "The ordinary homology sheet formula has the same finite-fiber and constant-cardinality hypotheses as the chain formula."
    - declaration: "ContinuousMap.normalizeOfNoZero"
      file: "SphereTopology/Homotopy/TangentField.lean"
      note: "Normalize a pointwise nowhere-zero continuous map from any topological space into a real normed vector space."
    - declaration: "Metric.Sphere.homotopyAntipodalOfUnitOrthogonal"
      file: "SphereTopology/Homotopy/TangentField.lean"
      note: "A continuous unit orthogonal field gives an identity-to-antipodal homotopy in any real inner-product space."
    - declaration: "Metric.Sphere.homotopyAntipodalOfNowhereZeroOrthogonal"
      file: "SphereTopology/Homotopy/TangentField.lean"
      note: "Normalization supplies the same homotopy from a nowhere-zero orthogonal field; no finite-dimensional premise."
    - declaration: "AlgebraicTopology.singularSubdivision_boundary"
      file: "SphereTopology/Homology/Singular/Subdivision.lean"
      note: "Signed barycentric subdivision commutes with the integral singular boundary; separate naturality and degree-zero identity laws are provided."
    - declaration: "AlgebraicTopology.singularHomotopy_boundary"
      file: "SphereTopology/Homology/Singular/Subdivision.lean"
      note: "The support-preserving prism obeys boundary-H plus H-boundary equals identity minus subdivision, with a separate degree-zero law."
    - declaration: "AlgebraicTopology.exists_singularSubdivisionIterate_chain_cover_small"
      file: "SphereTopology/Homology/Singular/Subdivision.lean"
      note: "A finite-support integral chain has a common subdivision exponent making every supported simplex small for the open cover."
    - declaration: "AlgebraicTopology.quasiIso_smallSingularChainInclusion"
      file: "SphereTopology/Homology/Singular/SmallChains.lean"
      note: "Cover-small integral singular chains include by a quasi-isomorphism, with arbitrary ambient and cover-index universes and no nonemptiness assumption."
    - declaration: "AlgebraicTopology.smallSingularChainMap_comp_inclusion"
      file: "SphereTopology/Homology/Singular/SmallChains.lean"
      note: "Cover-compatible continuous maps commute with small-chain inclusion; refinement has its own inclusion law."
    - declaration: "AlgebraicTopology.twoOpenSmallShortExact"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Ordered two-open small-chain short exact sequence, with difference (c,-c) followed by sum."
    - declaration: "AlgebraicTopology.twoOpenMayerVietoris_exact_at_intersection"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Ordinary integral Mayer-Vietoris exactness at the open-subspace intersection for a two-open cover."
    - declaration: "AlgebraicTopology.twoOpenMayerVietoris_exact_at_biprod"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Exactness at the biproduct of the open-set homology objects."
    - declaration: "AlgebraicTopology.twoOpenMayerVietoris_exact_at_space"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Exactness at ambient homology before the connecting boundary, including the H1-to-H0 segment."
    - declaration: "AlgebraicTopology.twoOpenMayerVietorisδ_naturality_induced"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Connecting-map naturality for a continuous map preserving the specified ordered opens."
    - declaration: "AlgebraicTopology.twoOpenMayerVietorisδ_swap_eq_neg"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "Reversing the ordered cover gives the integral minus sign after the explicit intersection swap."
    - declaration: "AlgebraicTopology.integralSingularHomologyMap_eq_neg_id_of_twoOpen_swap"
      file: "SphereTopology/Homology/Singular/MayerVietoris.lean"
      note: "A cover-swapping map acts by minus identity only with the transported-intersection identity and monic connecting-map hypotheses."
    - declaration: "TopCat.reducedSingularHomologyFunctor"
      file: "SphereTopology/Homology/Singular/Reduced.lean"
      note: "Nonnegative reduced integral homology: the augmentation kernel in degree zero and ordinary homology in positive degrees."
    - declaration: "TopCat.reducedSingularHomologyIsoOfHomotopyEquiv"
      file: "SphereTopology/Homology/Singular/Reduced.lean"
      note: "Homotopy equivalences induce reduced homology isomorphisms in every nonnegative degree."
    - declaration: "TopCat.isZero_reducedSingularHomology_of_contractible"
      file: "SphereTopology/Homology/Singular/Reduced.lean"
      note: "Reduced homology vanishes for a space with a ContractibleSpace instance; this premise includes nonemptiness."
    - declaration: "TopCat.isZero_reducedSingularHomologyZero_empty"
      file: "SphereTopology/Homology/Singular/Reduced.lean"
      note: "The empty space has zero degree-zero augmentation kernel; this is not a degree-minus-one convention."
    - declaration: "TopCat.reducedSingularHomologyZeroTwoPointIntegerIso_swap"
      file: "SphereTopology/Homology/Singular/Reduced.lean"
      note: "Two-point transposition acts by minus identity in the fixed integral basis [false]-[true]."
    - declaration: "TopCat.isIso_singularHomology₀ε_iff_pathConnectedSpace"
      file: "SphereTopology/Homology/Singular/Connectedness.lean"
      note: "For a nonzero coefficient object in a preadditive category with small coproducts and homology, total H0 augmentation is invertible exactly when the space is path connected; nonemptiness is a conclusion, not an assumption."
    - declaration: "TopCat.isZero_reducedSingularHomologyZero_iff_pathConnectedSpace"
      file: "SphereTopology/Homology/Singular/Connectedness.lean"
      note: "For a nonempty space, integral reduced H0 vanishes exactly when the space is path connected; nonemptiness is essential."
    - declaration: "AlgebraicTopology.twoOpenReducedMayerVietorisδZero"
      file: "SphereTopology/Homology/Singular/ReducedMayerVietoris.lean"
      note: "The low-degree boundary lands in reduced H0 of the open-subspace intersection, with explicit ordinary-homology comparison."
    - declaration: "AlgebraicTopology.twoOpenReducedMayerVietoris_exact_intersectionZero"
      file: "SphereTopology/Homology/Singular/ReducedMayerVietoris.lean"
      note: "Reduced low-degree exactness at the intersection, with separate naturality and ordered-cover swap laws."
    - declaration: "AlgebraicTopology.twoOpenReducedMayerVietorisIsoOfAcyclicOpens"
      file: "SphereTopology/Homology/Singular/ReducedMayerVietoris.lean"
      note: "The reduced H1-to-H0 boundary is an isomorphism when both H0 and H1 vanish for each of the two opens."
    - declaration: "SphereTopology.circlePunctureIntersectionHomotopyEquiv"
      file: "SphereTopology/Homology/Singular/Circle.lean"
      note: "The metric unit circle's east/west puncture intersection deforms to two points, with false=upper and true=lower."
    - declaration: "SphereTopology.reducedSingularHomologyOneSphereOneIntegerIso"
      file: "SphereTopology/Homology/Singular/Circle.lean"
      note: "Explicit reduced H1 of the unit sphere in EuclideanSpace real (Fin 2) is isomorphic to the integers."
    - declaration: "SphereTopology.circleReducedMayerVietoris_swap_eq_neg"
      file: "SphereTopology/Homology/Singular/Circle.lean"
      note: "The geometric ordered circle cover retains the reduced Mayer-Vietoris minus sign on reversal."
    - declaration: "SphereTopology.sphere2PunctureIntersectionEquatorHomotopyEquiv"
      file: "SphereTopology/Homology/Singular/Sphere.lean"
      note: "The north/south puncture intersection of the standard metric S2 deforms to its equator by normalized (x,y,t*z); equator points are fixed."
    - declaration: "SphereTopology.sphere2EquatorHomeomorphSphere1"
      file: "SphereTopology/Homology/Singular/Sphere.lean"
      note: "Equator-to-circle coordinates preserve the ordered pair (x,y), without an implicit orientation reversal."
    - declaration: "SphereTopology.reducedSingularHomologyTwoSphereTwoIntegerIso"
      file: "SphereTopology/Homology/Singular/Sphere.lean"
      note: "Explicit reduced H2 of the unit sphere in EuclideanSpace real (Fin 3) is isomorphic to the integers."
    - declaration: "SphereTopology.sphere2PunctureIntersectionAntipodal_homotopic_id"
      file: "SphereTopology/Homology/Singular/SphereAntipodal.lean"
      note: "The antipodal action on the puncture intersection is homotopic to identity through an equatorial half-turn."
    - declaration: "SphereTopology.integralSingularHomologyMap_sphere2Antipodal_two"
      file: "SphereTopology/Homology/Singular/SphereAntipodal.lean"
      note: "The antipodal map on the standard metric S2 acts by minus identity on ordinary integral H2, using ordered-cover exchange."
    - declaration: "SphereTopology.reducedSingularHomologyTwoSphereTwoIntegerIso_antipodal"
      file: "SphereTopology/Homology/Singular/SphereAntipodal.lean"
      note: "In the fixed reduced-H2 integer coordinate, the antipodal action is multiplication by minus one."
    - declaration: "SphereTopology.sphere2_id_not_homotopic_antipodal"
      file: "SphereTopology/Homology/Singular/SphereAntipodal.lean"
      note: "Identity and antipodal on the standard metric two-sphere are not continuously homotopic."
    - declaration: "SphereTopology.sphere2_exists_zero_of_orthogonal_field"
      file: "SphereTopology/Homotopy/HairyBallSphere2.lean"
      note: "Every continuous field V from the standard metric S2 to real Euclidean 3-space, pointwise orthogonal to its base point, has a zero."

