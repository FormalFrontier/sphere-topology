fidelity:
  divergences: >-
    Generic small-chain and two-open homology results retain arbitrary TopCat
    universes, lifted integral coefficients and exact cover hypotheses. Reduced
    homology uses nonnegative degrees; no augmented degree-minus-one statement
    follows. Contractible-space premises include nonemptiness; empty-space and
    degenerate-cover clients use their separately valid hypotheses. Acyclic-open
    isomorphisms retain both adjacent-degree vanishings, and the cover-swapping
    minus-identity criterion retains its monomorphism and transported-map premises.
    Explicit geometric calculations concern the literal unit circle and S2 and
    their fixed integral coordinates, not every homology group of every sphere,
    arbitrary coefficients, characteristic-two obstructions or smooth tangent
    bundles. The tangent-field homotopy is more general than the finite-dimensional
    hairy-ball endpoint. No Clifford algebra theory, arbitrary-sphere hairy-ball
    theorem, algebraic nonfree-kernel/row result or complete source formalization
    is claimed. Source-specific bridges and milestone decisions remain separate.
    Explicitly noncomputable subdivideSimplex, homotopySimplex,
    singularSubdivisionIterate and singularHomotopyIterate expose mathematical
    definitions and equations, not executable extraction; removing four generated
    partial companions narrows the runtime interface. Unknown external executable
    consumers are not certified. Removing the unused DecidableEq alpha binder
    from exists_mem_support_of_mem_support_sum preserves its result but can affect
    explicit positional or named-class applications in external clients.

review:
