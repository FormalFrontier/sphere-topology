name = "sphere-topology"
version = "0.1.0"
defaultTargets = ["SphereTopology", "SphereTopologyTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "SphereTopology"

[[lean_lib]]
name = "SphereTopologyTest"
roots = [
  "SphereTopologyTest.AugmentationSimp",
  "SphereTopologyTest.Axioms",
  "SphereTopologyTest.Circle",
  "SphereTopologyTest.CircleDegree",
  "SphereTopologyTest.CircleFundamentalGroup",
  "SphereTopologyTest.CircleModuleAxioms",
  "SphereTopologyTest.Clients",
  "SphereTopologyTest.Components",
  "SphereTopologyTest.Connectedness",
  "SphereTopologyTest.CoveringMonodromy",
  "SphereTopologyTest.CoveringEquivalence",
  "SphereTopologyTest.DeckGroup",
  "SphereTopologyTest.HairyBallSphere2",
  "SphereTopologyTest.HairyBallSphere2ModuleAxioms",
  "SphereTopologyTest.HairyBallSphere2Root",
  "SphereTopologyTest.HSpaceFundamentalGroup",
  "SphereTopologyTest.MayerVietoris",
  "SphereTopologyTest.PublicAPIClient",
  "SphereTopologyTest.Reduced",
  "SphereTopologyTest.ReducedAxioms",
  "SphereTopologyTest.ReducedMayerVietoris",
  "SphereTopologyTest.ReducedMayerVietorisModuleAxioms",
  "SphereTopologyTest.ReducedModuleAxioms",
  "SphereTopologyTest.SmallChains",
  "SphereTopologyTest.SingularLifts",
  "SphereTopologyTest.SingularTransfer",
  "SphereTopologyTest.Sphere",
  "SphereTopologyTest.SphereAntipodal",
  "SphereTopologyTest.SphereAntipodalModuleAxioms",
  "SphereTopologyTest.SphereAntipodalRoot",
  "SphereTopologyTest.Topology.CoveringLifting",
  "SphereTopologyTest.SphereModuleAxioms"
]

# Verification declarations are intentionally private.
[lean_lib.leanOptions]
weak.linter.privateModule = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "simplicial-objects"
git = "https://github.com/FormalFrontier/simplicial-objects"
rev = "fe4b0a3e8f245c1ba30a640330d66f95ea7dddda"
