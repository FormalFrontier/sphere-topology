# Verification declarations are intentionally private.
[lean_lib.leanOptions]
weak.linter.privateModule = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "simplicial-objects"
git = "https://github.com/FormalFrontier/simplicial-objects"
rev = "143f667bdeb0aeccd02e6475781d5c456f00c95b"

[[require]]
name = "fundamental-groupoids"
git = "https://github.com/FormalFrontier/fundamental-groupoids"
